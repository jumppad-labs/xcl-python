# Tests the package on every platform it is published for, against every
# supported CPython, with the engine built from the xcl checkout named in
# xcl-ref.txt. Go and a C compiler are needed here only to build that engine;
# a released wheel bundles it and needs neither.
#
# The Docker plugin tests run where a Docker engine is reachable, the Linux
# x86-64 runner; everywhere else they skip. musl is tested in Alpine
# containers on the two Linux runners.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: '1.27.0'

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest, windows-11-arm]
        python: ['3.10', '3.11', '3.12', '3.13', '3.x']
    steps:
      - uses: actions/checkout@v4

      - name: Read the xcl ref
        id: xcl
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < xcl-ref.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: jumppad-labs/xcl
          ref: ${{ steps.xcl.outputs.ref }}
          path: xcl

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: arduino/setup-protoc@v3
        with:
          version: '28.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate the messages and build the engine and fixture plugins
        shell: bash
        run: |
          make protos libxcl plugins XCL_SRC="$PWD/xcl" PYTHON=python

      - name: Install
        shell: bash
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'

      - name: Test
        shell: bash
        env:
          XCL_SRC: ${{ github.workspace }}/xcl
        run: python -m pytest -q

  # musl: the same suite inside Alpine, on both Linux architectures
  test-musl:
    name: alpine / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    container:
      image: python:3-alpine
    steps:
      - name: Install the toolchain
        run: apk add --no-cache bash build-base git go make protobuf-dev curl tar

      - uses: actions/checkout@v4

      - name: Read the xcl ref
        id: xcl
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < xcl-ref.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: jumppad-labs/xcl
          ref: ${{ steps.xcl.outputs.ref }}
          path: xcl

      - name: Generate the messages and build the engine and fixture plugins
        shell: bash
        run: make protos libxcl plugins XCL_SRC="$PWD/xcl" PYTHON=python

      - name: Install and test
        shell: bash
        env:
          XCL_SRC: ${{ github.workspace }}/xcl
        run: |
          python -m pip install --upgrade pip && python -m pip install -e '.[test]'
          python -m pytest -q

  # the package metadata must be acceptable to PyPI
  check-package:
    name: Check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - run: python -m twine check dist/*
