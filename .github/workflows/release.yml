# Publishes the xcl-lang package, imported as xcl, for one xcl-python tag. The
# tag is pushed by tag.yml when a pull request with a major, minor or patch
# label merges; the workflow can also be run by hand for a tag. The package
# version comes from the tag, and the engine it bundles from the xcl tag
# pinned in xcl-ref.txt at that tag: the two are versioned separately.
#
# For each of the seven platforms the workflow downloads the engine program's
# archive, xcl-core_<version>_<os>_<arch>[_musl], the checksums and their
# signature from the pinned xcl release, verifies the signature against
# keys/jumppad-labs.asc and the archive against the checksums, places the
# program in the package's xcl/_bin, regenerates the messages from xcl at the
# pin, builds a wheel tagged py3-none-<platform> at the tag's version, and
# runs the parity suite against that wheel. An sdist is built too. Everything
# is published with PyPI Trusted Publishing from the pypi environment, and the
# published package is then installed on every platform with no Go or C
# compiler on the path, where .github/scripts/install_check.py applies a
# configuration, reads the entity back and checks the engine reports the pin.
# Last, a GitHub release is created for the tag, its notes listing the pull
# requests merged since the previous tag and naming the bundled engine.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The xcl-python tag to release, e.g. v0.8.1
        required: true
        type: string

env:
  GO_VERSION: '1.27.0'

jobs:
  settings:
    name: Settings
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.settings.outputs.tag }}
      version: ${{ steps.settings.outputs.version }}
      engine: ${{ steps.settings.outputs.engine }}
      engine-version: ${{ steps.settings.outputs.engine-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - id: settings
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "the tag must start with v, got $TAG"; exit 1 ;;
          esac
          # the engine is the xcl tag pinned at the package's tag
          engine="$(tr -d '[:space:]' < xcl-ref.txt)"
          case "$engine" in
            v*) ;;
            *) echo "xcl-ref.txt must pin an xcl tag starting with v, got $engine"; exit 1 ;;
          esac
          echo "package $TAG bundles the xcl engine $engine"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "engine-version=${engine#v}" >> "$GITHUB_OUTPUT"

  wheels:
    name: Wheel ${{ matrix.target.platform }}
    needs: settings
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { platform: manylinux_2_28_x86_64,  asset: linux_amd64,      runner: ubuntu-latest,    exe: xcl-core }
          - { platform: manylinux_2_28_aarch64, asset: linux_arm64,      runner: ubuntu-24.04-arm, exe: xcl-core }
          - { platform: macosx_11_0_arm64,      asset: darwin_arm64,     runner: macos-latest,     exe: xcl-core }
          - { platform: win_amd64,              asset: windows_amd64,    runner: windows-latest,   exe: xcl-core.exe }
          - { platform: win_arm64,              asset: windows_arm64,    runner: windows-11-arm,   exe: xcl-core.exe }
    env:
      TAG: ${{ needs.settings.outputs.tag }}
      VERSION: ${{ needs.settings.outputs.version }}
      ENGINE: ${{ needs.settings.outputs.engine }}
      ENGINE_VERSION: ${{ needs.settings.outputs.engine-version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/checkout@v4
        with:
          repository: jumppad-labs/xcl
          ref: ${{ env.ENGINE }}
          path: xcl-src

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: arduino/setup-protoc@v3
        with:
          version: '28.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and verify the engine program
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine && cd engine
          case '${{ matrix.target.asset }}' in
            windows_*) archive="xcl-core_${ENGINE_VERSION}_${{ matrix.target.asset }}.zip" ;;
            *)         archive="xcl-core_${ENGINE_VERSION}_${{ matrix.target.asset }}.tar.gz" ;;
          esac
          gh release download "$ENGINE" --repo jumppad-labs/xcl \
            --pattern "$archive" \
            --pattern "xcl-core_${ENGINE_VERSION}_checksums.txt" \
            --pattern "xcl-core_${ENGINE_VERSION}_checksums.txt.sig"
          gpg --batch --import ../tests/keys/jumppad-labs.asc
          gpg --batch --verify "xcl-core_${ENGINE_VERSION}_checksums.txt.sig" "xcl-core_${ENGINE_VERSION}_checksums.txt"
          grep " $archive\$" "xcl-core_${ENGINE_VERSION}_checksums.txt" | sha256sum -c -
          case "$archive" in
            *.zip)    unzip -q "$archive" ;;
            *.tar.gz) tar -xzf "$archive" ;;
          esac
          mkdir -p ../xcl/_bin
          cp '${{ matrix.target.exe }}' ../xcl/_bin/
          case '${{ matrix.target.exe }}' in
            *.exe) ;;
            *) chmod +x '../xcl/_bin/${{ matrix.target.exe }}' ;;
          esac

      - name: Set the version from the tag and the engine from the pin
        shell: bash
        run: |
          python - <<'EOF'
          import os, re
          path = "xcl/_version.py"
          text = open(path).read()
          text = re.sub(r'__version__\s*=\s*"[^"]+"', f'__version__ = "{os.environ["VERSION"]}"', text)
          text = re.sub(r'__engine_version__\s*=\s*"[^"]+"', f'__engine_version__ = "{os.environ["ENGINE"]}"', text)
          open(path, "w").write(text)
          EOF
          grep _version__ xcl/_version.py

      - name: Regenerate the messages from xcl at the pin
        shell: bash
        run: make protos XCL_SRC="$PWD/xcl-src" PYTHON=python

      - name: Check the engine reports the pin
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -c "import xcl; v = xcl.engine_version(); print(v); assert v == '$ENGINE', v"

      - name: Build the wheel
        shell: bash
        env:
          XCL_WHEEL_PLATFORM: ${{ matrix.target.platform }}
        run: |
          python -m pip install build
          python -m build --wheel
          ls dist

      - name: Build the fixture plugins and the Go parity program
        shell: bash
        run: make plugins XCL_SRC="$PWD/xcl-src" PYTHON=python

      - name: Test the wheel
        shell: bash
        env:
          XCL_SRC: ${{ github.workspace }}/xcl-src
          XCL_TEST_STRICT: '1'
          XCL_TEST_ENGINES: subprocess
        run: |
          python -m pip uninstall -y xcl-lang
          python -m pip install dist/*.whl pytest
          # the installed wheel is what runs: the suite is run from outside
          # the source tree so the package is imported from site-packages
          python -m pytest -q tests/parity tests/integration/test_load.py --rootdir . -p no:cacheprovider

      - name: Check the installed engine program is executable
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -c "import os, xcl; from xcl._transport.subprocess import program_path; p = program_path(); print(p); assert p.is_file(), p; assert os.access(p, os.X_OK), f'{p} is not executable'"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target.platform }}
          path: dist/*.whl
          if-no-files-found: error

  # the musl wheels are built inside Alpine started by hand: GitHub cannot run
  # its JavaScript actions in an Alpine job container on the arm64 runners,
  # so the checkouts happen on the runner and the rest in the container
  wheels-musl:
    name: Wheel ${{ matrix.target.platform }}
    needs: settings
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { platform: musllinux_1_2_x86_64,  asset: linux_amd64_musl, runner: ubuntu-latest }
          - { platform: musllinux_1_2_aarch64, asset: linux_arm64_musl, runner: ubuntu-24.04-arm }
    env:
      TAG: ${{ needs.settings.outputs.tag }}
      VERSION: ${{ needs.settings.outputs.version }}
      ENGINE: ${{ needs.settings.outputs.engine }}
      ENGINE_VERSION: ${{ needs.settings.outputs.engine-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/checkout@v4
        with:
          repository: jumppad-labs/xcl
          ref: ${{ env.ENGINE }}
          path: xcl-src

      - name: Build and test the wheel in Alpine
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          XCL_WHEEL_PLATFORM: ${{ matrix.target.platform }}
          ASSET: ${{ matrix.target.asset }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e TAG -e VERSION -e ENGINE -e ENGINE_VERSION -e GH_TOKEN -e XCL_WHEEL_PLATFORM -e ASSET -e GO_VERSION -e XCL_SRC=/work/xcl-src \
            python:3-alpine sh -e .github/scripts/musl-wheel.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target.platform }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: settings
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.settings.outputs.version }}
      ENGINE: ${{ needs.settings.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.settings.outputs.tag }}
      - uses: actions/checkout@v4
        with:
          repository: jumppad-labs/xcl
          ref: ${{ env.ENGINE }}
          path: xcl-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: arduino/setup-protoc@v3
        with:
          version: '28.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set the version and regenerate the messages
        run: |
          sed -i "s/__version__ = \"[^\"]*\"/__version__ = \"$VERSION\"/" xcl/_version.py
          sed -i "s/__engine_version__ = \"[^\"]*\"/__engine_version__ = \"$ENGINE\"/" xcl/_version.py
          make protos XCL_SRC="$PWD/xcl-src" PYTHON=python
      - run: python -m pip install build twine && python -m build --sdist && python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [settings, wheels, wheels-musl, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the distributions
        run: |
          mkdir -p dist
          find artifacts -name '*.whl' -exec cp {} dist/ \;
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ls -la dist
          [ "$(ls dist/*.whl | wc -l)" -eq 7 ] || { echo "expected 7 wheels"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist

  # install the published package on every platform with no Go or C compiler
  # on the path, and check it applies a configuration, reads it back and
  # reports the pinned engine
  install-check:
    name: Install check ${{ matrix.target.platform }}
    needs: [settings, publish]
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { platform: manylinux_2_28_x86_64,  runner: ubuntu-latest }
          - { platform: manylinux_2_28_aarch64, runner: ubuntu-24.04-arm }
          - { platform: macosx_11_0_arm64,      runner: macos-latest }
          - { platform: win_amd64,              runner: windows-latest }
          - { platform: win_arm64,              runner: windows-11-arm }
    env:
      TAG: ${{ needs.settings.outputs.tag }}
      VERSION: ${{ needs.settings.outputs.version }}
      ENGINE_TAG: ${{ needs.settings.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: .github/scripts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install from PyPI without a toolchain
        shell: bash
        run: |
          # hide every Go and C compiler the runner has
          mkdir -p "$HOME/clean-bin"
          for tool in go gcc cc clang zig; do
            printf '#!/bin/sh\necho "%s is not available" >&2\nexit 127\n' "$tool" > "$HOME/clean-bin/$tool"
            chmod +x "$HOME/clean-bin/$tool"
          done
          export PATH="$HOME/clean-bin:$PATH"
          for attempt in $(seq 1 20); do
            if python -m pip install --no-cache-dir "xcl-lang==$VERSION"; then break; fi
            echo "xcl-lang==$VERSION is not on PyPI yet, waiting (attempt $attempt)"; sleep 30
          done
          python .github/scripts/install_check.py

  # the same check on musl, in a plain Alpine image that has no compiler at all
  install-check-musl:
    name: Install check ${{ matrix.target.platform }}
    needs: [settings, publish]
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { platform: musllinux_1_2_x86_64,  runner: ubuntu-latest }
          - { platform: musllinux_1_2_aarch64, runner: ubuntu-24.04-arm }
    env:
      TAG: ${{ needs.settings.outputs.tag }}
      VERSION: ${{ needs.settings.outputs.version }}
      ENGINE_TAG: ${{ needs.settings.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: .github/scripts

      - name: Install from PyPI without a toolchain
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e TAG -e VERSION -e ENGINE_TAG python:3-alpine sh -ec '
            for attempt in $(seq 1 20); do
              if python -m pip install --no-cache-dir "xcl-lang==$VERSION"; then break; fi
              echo "xcl-lang==$VERSION is not on PyPI yet, waiting (attempt $attempt)"; sleep 30
            done
            python .github/scripts/install_check.py'

  # the GitHub release for the tag: the pull requests merged since the
  # previous tag, and the engine the package bundles
  github-release:
    name: GitHub release
    needs: [settings, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.settings.outputs.tag }}
      ENGINE: ${{ needs.settings.outputs.engine }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create the release
        run: |
          previous="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[].ref | sub("^refs/tags/"; "")' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | awk -v tag="$TAG" '$0 == tag { print prev; exit } { prev = $0 }')"
          start=()
          if [ -n "$previous" ]; then
            echo "notes from $previous to $TAG"
            start=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "Bundles the xcl engine [$ENGINE](https://github.com/jumppad-labs/xcl/releases/tag/$ENGINE)." \
            --generate-notes "${start[@]}"
