[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "xcl-lang"
description = "XCL, the declarative configuration language, for Python: the xcl engine run as a bundled subprocess on every platform, imported as xcl"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jumppad Labs" }]
keywords = ["xcl", "configuration", "hcl", "infrastructure"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]
dependencies = [
  # protobuf carries every CoreService message between Python and the
  # engine; 5.26 is the first release whose generated code the upb runtime
  # accepts across the CPython versions supported here
  "protobuf>=5.26",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  # tomli is the backport of tomllib for CPython 3.10, the only supported
  # version without a standard TOML reader; the tests read their pinned plugin
  # release with it there, and it is not installed where tomllib exists
  "tomli>=2.0; python_version < '3.11'",
]
# cffi is used only by the in-process route of a source build
# (XCL_TRANSPORT=inprocess), which loads the shared library in ABI mode; the
# ctypes fallback in the standard library is used when it is not installed,
# so the default install, which runs the bundled engine program, needs no
# compiled dependency beyond protobuf
inprocess = [
  "cffi>=1.16",
]

[project.urls]
Homepage = "https://xcl.dev"
Source = "https://github.com/jumppad-labs/xcl-python"
Engine = "https://github.com/jumppad-labs/xcl"

[tool.hatch.version]
path = "xcl/_version.py"

[tool.hatch.build.targets.sdist]
only-include = ["xcl", "tests", "Makefile", "README.md", "LICENSE", "PARITY.md", "hatch_build.py", "xcl-ref.txt"]
exclude = ["xcl/_bin/", "xcl/_lib/", "**/__pycache__/", "build/"]

[tool.hatch.build.targets.wheel]
packages = ["xcl"]
# the engine program is placed in xcl/_bin, and a source build's shared
# library in xcl/_lib; both are ignored by git, so they must be named here to
# be packaged
artifacts = ["xcl/_bin/*", "xcl/_lib/*"]

# the hook marks the wheel platform specific and tags it py3-none-<platform>
# from XCL_WHEEL_PLATFORM, see hatch_build.py
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
