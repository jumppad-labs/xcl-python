[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "xcl"
description = "XCL, the declarative configuration language, for Python: the xcl engine driven through a shared library"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jumppad Labs" }]
keywords = ["xcl", "configuration", "hcl", "infrastructure"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]
dependencies = [
  # protobuf carries every CoreService message between Python and the
  # engine; 5.26 is the first release whose generated code the upb runtime
  # accepts across the CPython versions supported here
  "protobuf>=5.26",
  # cffi loads the engine in ABI mode, so one wheel per platform serves every
  # CPython version and no extension is compiled; the ctypes fallback in the
  # standard library is used when cffi is unavailable
  "cffi>=1.16",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[project.urls]
Homepage = "https://xcl.dev"
Source = "https://github.com/jumppad-labs/xcl-python"
Engine = "https://github.com/jumppad-labs/xcl"

[tool.hatch.version]
path = "xcl/_version.py"

[tool.hatch.build.targets.sdist]
include = ["xcl/", "tests/", "Makefile", "README.md", "LICENSE", "PARITY.md", "hatch_build.py", "xcl-ref.txt"]
exclude = ["xcl/_lib/"]

[tool.hatch.build.targets.wheel]
packages = ["xcl"]
# the engine is built into xcl/_lib and is ignored by git, so it must be
# named here to be packaged
artifacts = ["xcl/_lib/*"]

# the hook marks the wheel platform specific and tags it py3-none-<platform>
# from XCL_WHEEL_PLATFORM, see hatch_build.py
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
